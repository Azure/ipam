name: Azure IPAM Testing

run-name: Azure IPAM Deployment & Testing

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - 'examples/**'
      - 'migrate/**'
      - '.dockerignore'
      - '.env.example'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
      - '*.md'

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.IPAM_TEST_ACR }}
  IPAM_UI_NAME: ipam-ui-${{ github.run_id }}-${{ github.run_attempt }}
  IPAM_ENGINE_NAME: ipam-engine-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  lint:
    name: Lint & Build Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Azure IPAM Code
        id: checkoutCode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        id: setupNode
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Must match the App Service runtime declared in engine/app/version.json
      - name: Read Python Version
        id: pythonVersion
        run: echo "version=$(jq -r .python engine/app/version.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        id: setupPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.pythonVersion.outputs.version }}

      - name: Lint Azure IPAM UI (ESLint)
        id: lintUI
        working-directory: ui
        run: |
          npm ci
          npm run lint

      - name: Build Azure IPAM UI (Vite)
        id: buildUI
        working-directory: ui
        run: npm run build

      - name: Lint Azure IPAM Engine (Ruff)
        id: lintEngine
        run: |
          pip install ruff
          ruff check engine/

      - name: Lint Bicep Templates
        id: lintBicep
        run: az bicep build --file deploy/main.bicep --stdout > /dev/null

      - name: Lint Dockerfiles Debian (Hadolint)
        id: lintDockerfilesDeb
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.deb
          recursive: true

      - name: Lint Dockerfiles RHEL (Hadolint)
        id: lintDockerfilesRhel
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.rhel
          recursive: true

      - name: Lint Dockerfiles Function (Hadolint)
        id: lintDockerfilesFunc
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.func
          recursive: true

      - name: Lint Dockerfiles Development (Hadolint)
        id: lintDockerfilesDev
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.dev
          recursive: true

      - name: Lint Dockerfiles Load Balancer (Hadolint)
        id: lintDockerfilesLb
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true

  deploy:
    name: Deploy Azure IPAM
    runs-on: ubuntu-latest
    needs: [ lint ]
    outputs:
      ipamURL: ${{ steps.deployScript.outputs.ipamURL }}
      ipamUIAppId: ${{ steps.deployScript.outputs.ipamUIAppId }}
      ipamEngineAppId: ${{ steps.deployScript.outputs.ipamEngineAppId }}
      ipamSuffix: ${{ steps.deployScript.outputs.ipamSuffix }}
      ipamResourceGroup: ${{ steps.deployScript.outputs.ipamResourceGroup }}
    steps:
      - name: Install Deployment Prerequisites
        id: installPrerequisites
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Az -AllowClobber -Force
          Install-Module Microsoft.Graph -AllowClobber -Force

      - name: Azure Login
        id: azureLogin
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_TEST_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TEST_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_TEST_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Checkout Azure IPAM Code
        id: checkoutRepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            deploy
            engine
            ui

      - name: Build Azure IPAM Container
        id: buildContainer
        run: |
          az acr build -r $ACR_NAME -t ipam:${{ github.run_id }}-${{ github.run_attempt }} -f ./Dockerfile.deb . --build-arg PROD_BUILD=false

      - name: Update Bicep File
        id: updateBicep
        working-directory: deploy
        shell: pwsh
        run: |
          $acrName = "$env:ACR_NAME.azurecr.io"
          $containerName = "ipam:${{ github.run_id }}-${{ github.run_attempt }}"

          $bicepFile = Get-Content -Path ./modules/appService.bicep

          $bicepFile = $bicepFile -replace "registry.azureipam.com", $acrName
          $bicepFile = $bicepFile -replace "ipam:latest", $containerName

          $bicepFile | Out-File -FilePath ./modules/appService.bicep -Force

      - name: Deploy Azure IPAM
        id: deployScript
        working-directory: deploy
        shell: pwsh
        run: ./deploy.ps1 -Location "westus3" -UIAppName $env:IPAM_UI_NAME -EngineAppName $env:IPAM_ENGINE_NAME

      - name: "Upload Logs"
        id: uploadLogs
        # Always upload logs (success or failure) so deployment failures can be reviewed
        if: always()
        env:
          AZURE_IPAM_SUFFIX: ${{ steps.deployScript.outputs.ipamSuffix }}
          STORAGE_ACCT_RG: ${{ vars.LOGGING_STORAGE_RG }}
          STORAGE_ACCT_NAME: ${{ vars.LOGGING_STORAGE_NAME }}
          STORAGE_ACCT_CTR: ${{ vars.LOGGING_STORAGE_CTR }}
        shell: pwsh
        run: |
          $suffix = if ([string]::IsNullOrWhiteSpace($env:AZURE_IPAM_SUFFIX)) { "FAILED" } else { $env:AZURE_IPAM_SUFFIX }
          $archiveName = "IPAM-RUN(${{ github.run_id }})-ATTEMPT(${{ github.run_attempt }})-SUFFIX($suffix).zip"

          $logDir = Join-Path $env:GITHUB_WORKSPACE "logs"

          if (-not (Test-Path -Path $logDir) -or -not (Get-ChildItem -Path $logDir -File -Recurse -ErrorAction SilentlyContinue)) {
            Write-Warning "No log files found to upload; skipping log upload."
            return
          }

          Compress-Archive -Path (Join-Path $logDir '*') -DestinationPath /tmp/$archiveName

          $storage = Get-AzStorageAccount -Name $env:STORAGE_ACCT_NAME -ResourceGroupName $env:STORAGE_ACCT_RG
          $context = $storage.Context

          $uploadDetails = @{
            File = "/tmp/$archiveName"
            Container = $env:STORAGE_ACCT_CTR
            Blob = $archiveName
            Context = $context
            StandardBlobTier = "Hot"
          }

          Set-AzStorageBlobContent @uploadDetails

          Write-Output "logFile=$archiveName" >> $Env:GITHUB_OUTPUT

      - name: "Output Azure IPAM Deployment Details"
        id: deploymentDetails
        env:
          DEPLOYMENT_DETAILS: ${{ steps.uploadLogs.outputs.deployDetails }}
        shell: pwsh
        run: |
          $deployDetails = @{
            GITHUB_RUN_ID = "${{ github.run_id }}(${{ github.run_attempt }})"
            IPAM_SUFFIX = "${{ steps.deployScript.outputs.ipamSuffix }}"
            IPAM_UI_APP_ID = "${{ steps.deployScript.outputs.ipamUIAppId }}"
            IPAM_ENGINE_APP_ID = "${{ steps.deployScript.outputs.ipamEngineAppId }}"
            IPAM_URL = "${{ steps.deployScript.outputs.ipamURL }}"
            IPAM_LOG_FILE = "${{ steps.uploadLogs.outputs.logFile }}"
          }

          Write-Host "-------------------"
          Write-Host "Deployment Details:"
          Write-Host "-------------------"
          Write-Host ($deployDetails | Format-Table | Out-String) -NoNewline
          Write-Host "-------------------"

      - name: "Sleep for 5 Minutes"
        id: sleep
        shell: pwsh
        run: Start-Sleep -s 300

  test:
    name: Test Azure IPAM
    runs-on: ubuntu-latest
    needs: [ deploy ]
    steps:
      - name: Install Testing Prerequisites
        id: installPrerequisites
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Az -AllowClobber -Force
          Install-Module Pester -AllowClobber -Force

      - name: Azure Login
        id: azureLogin
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_TEST_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TEST_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_TEST_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Checkout Azure IPAM Code
        id: checkoutRepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests

      - name: Test Azure IPAM w/ Pester
        id: ipamTesting
        working-directory: tests
        env:
          IPAM_RESOURCE_GROUP: ${{ needs.deploy.outputs.ipamResourceGroup }}
          IPAM_URL: ${{ needs.deploy.outputs.ipamURL }}
          IPAM_ENGINE_APP_ID: ${{ needs.deploy.outputs.ipamEngineAppId }}
        shell: pwsh
        run: |
          Import-Module Pester -PassThru

          $pesterSettings = @{
            Run = @{
              Path = "./azureipam.tests.ps1"
              PassThru = $true
              SkipRemainingOnFailure = "Run"
            }
            Output = @{
              Verbosity = "Detailed"
            }
          }

          $pesterConfig = New-PesterConfiguration -Hashtable $pesterSettings

          Invoke-Pester -Configuration $pesterConfig

  cleanup:
    name: Cleanup Azure IPAM
    runs-on: ubuntu-latest
    needs: [ deploy, test ]
    steps:
      - name: Install Cleanup Prerequisites
        id: installPrerequisites
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Az -AllowClobber -Force

      - name: Azure Login
        id: azureLogin
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_TEST_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TEST_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_TEST_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name : Remove Azure IPAM Identities
        id: cleanupIdentities
        if: always()
        shell: pwsh
        run: |
          $tenantId = (Get-AzContext).Tenant.Id
          $scope = "/providers/Microsoft.Management/managementGroups/$tenantId"

          $uiApp = Get-AzADApplication -ApplicationId ${{ needs.deploy.outputs.ipamUIAppId }}
          $engineApp = Get-AzADApplication -ApplicationId ${{ needs.deploy.outputs.ipamEngineAppId }}
          $engineSpn = Get-AzADServicePrincipal -ApplicationId ${{ needs.deploy.outputs.ipamEngineAppId }}

          Write-Host "Removing Engine SPN Role Assignment..."
          Remove-AzRoleAssignment -ObjectId $engineSpn.Id -Scope $scope -RoleDefinitionName Reader

          Write-Host "Removing UI Application..."
          $uiApp | Remove-AzADApplication
          Write-Host "Removing Engine Application..."
          $engineApp | Remove-AzADApplication

      - name: "Remove Azure IPAM Container"
        id: cleanupContainer
        if: always()
        run: |
          az acr repository delete --name $ACR_NAME --repository ipam --yes

      - name : Remove Azure IPAM Resources
        id: cleanupResources
        if: always()
        shell: pwsh
        run: |
          Remove-AzResourceGroup -Name ${{ needs.deploy.outputs.ipamResourceGroup }} -Force
