# Writable locations for running as a non-root user
pid /tmp/nginx.pid;

events {}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # include /etc/nginx/conf.d/*.conf;

    # Port 8080 first; port 80 remains as a fallback for older UI and engine images
    upstream ui {
        server ipam-ui:8080;
        server ipam-ui backup;
    }

    upstream engine {
        server ipam-engine:8080;
        server ipam-engine backup;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;

        proxy_next_upstream error timeout http_502;

        # Frontend
        location / {
            add_header X-Frame-Options "DENY";
            proxy_pass http://ui;
            proxy_intercept_errors on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            error_page 404 = /index.html;
        }

        # Backend
        location /api {
            proxy_pass http://engine;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # You may need this to prevent return 404 recursion.
        location = /404.html {
            internal;
        }
    }
}
